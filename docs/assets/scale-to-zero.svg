<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img" aria-label="A timeline comparing a burst handled by a BoundedDeployment and by an HPA. The BoundedDeployment idles at zero, jumps straight to exactly eight pods, then drains back to exactly zero as pods finish. The HPA starts at one, lags, overshoots to ten, settles near nine rather than on eight, and is still draining long after the burst, never reaching zero.">
  <rect width="900" height="470" fill="#ffffff"/>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">

    <text x="60" y="32" font-size="17" font-weight="700" fill="#0f172a">Zero to exactly eight, and back to zero</text>
    <text x="60" y="54" font-size="12" fill="#475569">the same burst of work, handled two ways</text>

    <!-- legend -->
    <g font-size="11" fill="#475569">
      <line x1="600" y1="30" x2="628" y2="30" stroke="#2563eb" stroke-width="2.6"/>
      <text x="636" y="34">BoundedDeployment</text>
      <line x1="600" y1="50" x2="628" y2="50" stroke="#d97706" stroke-width="2" stroke-dasharray="6 4"/>
      <text x="636" y="54">HPA + Deployment</text>
    </g>

    <!-- gridlines -->
    <g stroke="#eef2f6" stroke-width="1">
      <line x1="90" y1="320" x2="862" y2="320"/>
      <line x1="90" y1="274" x2="862" y2="274"/>
      <line x1="90" y1="228" x2="862" y2="228"/>
      <line x1="90" y1="182" x2="862" y2="182"/>
      <line x1="90" y1="136" x2="862" y2="136"/>
      <line x1="90" y1="90" x2="862" y2="90"/>
    </g>
    <g font-size="11" fill="#94a3b8" text-anchor="end">
      <text x="80" y="324">0</text>
      <text x="80" y="278">2</text>
      <text x="80" y="232">4</text>
      <text x="80" y="186">6</text>
      <text x="80" y="140">8</text>
      <text x="80" y="94">10</text>
    </g>

    <!-- event markers -->
    <g stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4 4">
      <line x1="242" y1="84" x2="242" y2="320"/>
      <line x1="546" y1="84" x2="546" y2="320"/>
    </g>
    <text x="248" y="78" font-size="10.5" fill="#475569">burst arrives</text>
    <text x="552" y="78" font-size="10.5" fill="#475569">backlog cleared</text>

    <!-- HPA -->
    <polyline points="90,297 280,297 280,274 330,274 330,228 380,228 380,159 430,159 430,90 470,90 470,113 698,113 698,136 728,136 728,159 758,159 758,182 788,182 788,205 818,205 818,228 850,228" fill="none" stroke="#d97706" stroke-width="2" stroke-dasharray="6 4" stroke-linejoin="round"/>

    <!-- BoundedDeployment -->
    <polyline points="90,320 242,320 250,320 250,297 258,297 258,274 266,274 266,251 274,251 274,228 282,228 282,205 290,205 290,182 298,182 298,159 306,159 306,136 546,136 576,136 576,159 606,159 606,182 636,182 636,205 666,205 666,228 696,228 696,251 726,251 726,274 756,274 756,297 786,297 786,320 850,320" fill="none" stroke="#2563eb" stroke-width="2.6" stroke-linejoin="round"/>

    <!-- axes -->
    <line x1="90" y1="84" x2="90" y2="320" stroke="#cbd5e1" stroke-width="1.5"/>
    <line x1="90" y1="320" x2="862" y2="320" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="34" y="202" font-size="11.5" fill="#475569" text-anchor="middle" transform="rotate(-90 34 202)">running pods</text>
    <text x="862" y="338" font-size="11" fill="#94a3b8" text-anchor="end">time</text>

    <!-- callouts -->
    <g stroke="#94a3b8" stroke-width="1" stroke-dasharray="2 3">
      <line x1="274" y1="240" x2="274" y2="331"/>
      <line x1="450" y1="90" x2="450" y2="331"/>
      <line x1="680" y1="228" x2="680" y2="331"/>
    </g>
    <g font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">
      <circle cx="274" cy="342" r="11" fill="#0f172a"/><text x="274" y="346">1</text>
      <circle cx="450" cy="342" r="11" fill="#0f172a"/><text x="450" y="346">2</text>
      <circle cx="680" cy="342" r="11" fill="#0f172a"/><text x="680" y="346">3</text>
    </g>

    <g font-size="11.5" fill="#334155">
      <circle cx="60" cy="368" r="9" fill="#0f172a"/>
      <text x="60" y="372" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
      <text x="76" y="372">Idle at 0, then to exactly 8 as fast as</text>
      <text x="76" y="388">pods can be created. No warm-up and no</text>
      <text x="76" y="404">tolerance band.</text>

      <circle cx="345" cy="368" r="9" fill="#0f172a"/>
      <text x="345" y="372" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
      <text x="361" y="372">The HPA lags behind the real signal,</text>
      <text x="361" y="388">overshoots to 10, then settles near the</text>
      <text x="361" y="404">target rather than on it.</text>

      <circle cx="630" cy="368" r="9" fill="#0f172a"/>
      <text x="630" y="372" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
      <text x="646" y="372">Floor back to 0. Each step is a pod that</text>
      <text x="646" y="388">finished its work, so the count lands on</text>
      <text x="646" y="404">exactly 0.</text>
    </g>

    <text x="60" y="440" font-size="11.5" fill="#475569">An HPA needs the HPAScaleToZero feature gate to reach zero; otherwise minReplicas is a hard floor of at least 1.</text>
  </g>
</svg>
