<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img" aria-label="A pod-count timeline. A blue floor line marks spec.replicas and a red dashed ceiling marks min plus margin. The controller only creates pods below the floor and only deletes pods above the ceiling; between the two it leaves the count alone, so pods drain by exiting on their own.">
  <rect width="900" height="470" fill="#ffffff"/>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">

    <!-- title -->
    <text x="60" y="32" font-size="17" font-weight="700" fill="#0f172a">One BoundedDeployment over time</text>
    <text x="60" y="54" font-size="12" fill="#475569">margin = 3, so the ceiling always sits three pods above the floor</text>

    <!-- legend -->
    <g font-size="11" fill="#475569">
      <line x1="600" y1="24" x2="624" y2="24" stroke="#0f172a" stroke-width="2.2"/>
      <text x="631" y="28">running pods</text>
      <rect x="600" y="41" width="24" height="10" fill="#e0f2fe"/>
      <text x="631" y="50">hands-off band</text>
      <line x1="745" y1="24" x2="769" y2="24" stroke="#2563eb" stroke-width="4"/>
      <text x="776" y="28">min = spec.replicas</text>
      <line x1="745" y1="46" x2="769" y2="46" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 4"/>
      <text x="776" y="50">max = min + margin</text>
    </g>

    <!-- gridlines and y ticks -->
    <g stroke="#eef2f6" stroke-width="1">
      <line x1="90" y1="360" x2="862" y2="360"/>
      <line x1="90" y1="314" x2="862" y2="314"/>
      <line x1="90" y1="268" x2="862" y2="268"/>
      <line x1="90" y1="222" x2="862" y2="222"/>
      <line x1="90" y1="176" x2="862" y2="176"/>
      <line x1="90" y1="130" x2="862" y2="130"/>
      <line x1="90" y1="84" x2="862" y2="84"/>
    </g>
    <g font-size="11" fill="#94a3b8" text-anchor="end">
      <text x="80" y="364">0</text>
      <text x="80" y="318">2</text>
      <text x="80" y="272">4</text>
      <text x="80" y="226">6</text>
      <text x="80" y="180">8</text>
      <text x="80" y="134">10</text>
      <text x="80" y="88">12</text>
    </g>

    <!-- hands-off band between min and max -->
    <polygon points="90,222 240,222 240,107 502.5,107 502.5,245 840,245 840,314 502.5,314 502.5,176 240,176 240,291 90,291" fill="#e0f2fe"/>
    <text x="371" y="147" font-size="12" fill="#0369a1" text-anchor="middle">controller leaves this range alone</text>

    <!-- min and max -->
    <polyline points="90,222 240,222 240,107 502.5,107 502.5,245 840,245" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 4"/>
    <polyline points="90,291 240,291 240,176 502.5,176 502.5,314 840,314" fill="none" stroke="#2563eb" stroke-width="4"/>

    <!-- actual running pod count -->
    <polyline points="90,291 240,291 258.75,291 258.75,268 277.5,268 277.5,245 296.25,245 296.25,222 315,222 315,199 333.75,199 333.75,176 502.5,176 510,176 510,199 521.25,199 521.25,222 532.5,222 532.5,245 600,245 600,268 660,268 660,291 720,291 720,314 840,314" fill="none" stroke="#0f172a" stroke-width="2.2" stroke-linejoin="round"/>

    <!-- axes -->
    <line x1="90" y1="76" x2="90" y2="360" stroke="#cbd5e1" stroke-width="1.5"/>
    <line x1="90" y1="360" x2="862" y2="360" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="34" y="228" font-size="11.5" fill="#475569" text-anchor="middle" transform="rotate(-90 34 228)">running pods</text>
    <text x="862" y="378" font-size="11" fill="#94a3b8" text-anchor="end">time</text>

    <!-- numbered callouts on the timeline -->
    <g stroke="#94a3b8" stroke-width="1" stroke-dasharray="2 3">
      <line x1="290" y1="245" x2="290" y2="371"/>
      <line x1="517" y1="199" x2="517" y2="371"/>
      <line x1="660" y1="280" x2="660" y2="371"/>
    </g>
    <g font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">
      <circle cx="290" cy="382" r="11" fill="#0f172a"/><text x="290" y="386">1</text>
      <circle cx="517" cy="382" r="11" fill="#0f172a"/><text x="517" y="386">2</text>
      <circle cx="660" cy="382" r="11" fill="#0f172a"/><text x="660" y="386">3</text>
    </g>

    <!-- annotations -->
    <g font-size="11.5" fill="#334155">
      <circle cx="60" cy="408" r="9" fill="#0f172a"/>
      <text x="60" y="412" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
      <text x="76" y="412">min is raised to 8. The controller adds one</text>
      <text x="76" y="428">pod per reconcile until the floor is met.</text>

      <circle cx="345" cy="408" r="9" fill="#0f172a"/>
      <text x="345" y="412" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
      <text x="361" y="412">min drops to 2, so max drops to 5. Three</text>
      <text x="361" y="428">pods sit above the ceiling, so the newest</text>
      <text x="361" y="444">ones are deleted first.</text>

      <circle cx="630" cy="408" r="9" fill="#0f172a"/>
      <text x="630" y="412" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
      <text x="646" y="412">Inside the band nothing is forced. Each</text>
      <text x="646" y="428">step down is a pod that finished its work</text>
      <text x="646" y="444">and exited on its own.</text>
    </g>
  </g>
</svg>
