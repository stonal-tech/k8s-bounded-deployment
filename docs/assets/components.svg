<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 545" width="900" height="545" role="img" aria-label="Integration diagram. A work source such as a queue feeds depth or lag to a scaler you supply, which patches spec.replicas on the BoundedDeployment resource. The controller watches that resource and creates, deletes or reaps worker pods, and the worker pods consume from the work source and exit zero when drained.">
  <rect width="900" height="545" fill="#ffffff"/>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">

    <text x="40" y="34" font-size="17" font-weight="700" fill="#0f172a">What plugs into a BoundedDeployment</text>

    <!-- Scaler (you bring it) -->
    <rect x="40" y="70" width="210" height="86" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="58" y="98" font-size="13" font-weight="700" fill="#0f172a">Scaler</text>
    <text x="58" y="118" font-size="11" fill="#475569">KEDA, a CronJob, or your</text>
    <text x="58" y="134" font-size="11" fill="#475569">own operator — anything that</text>
    <text x="58" y="150" font-size="11" fill="#475569">can PATCH a custom resource.</text>

    <!-- Work source -->
    <rect x="40" y="250" width="230" height="96" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="58" y="278" font-size="13" font-weight="700" fill="#0f172a">Work source</text>
    <text x="58" y="298" font-size="11" fill="#475569">RabbitMQ, Kafka, SQS, or a</text>
    <text x="58" y="314" font-size="11" fill="#475569">table of pending rows —</text>
    <text x="58" y="330" font-size="11" fill="#475569">whatever has a backlog.</text>

    <!-- BoundedDeployment CR -->
    <rect x="390" y="70" width="180" height="86" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="406" y="98" font-size="13" font-weight="700" fill="#0f172a">BoundedDeployment</text>
    <text x="406" y="118" font-size="11" fill="#1e40af">spec.replicas (min)</text>
    <text x="406" y="134" font-size="11" fill="#1e40af">spec.maxReplicas / margin</text>
    <text x="406" y="150" font-size="11" fill="#1e40af">spec.template</text>

    <!-- Controller -->
    <rect x="640" y="70" width="220" height="86" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="658" y="98" font-size="13" font-weight="700" fill="#0f172a">Controller</text>
    <text x="658" y="118" font-size="11" fill="#1e40af">the manager binary in this</text>
    <text x="658" y="134" font-size="11" fill="#1e40af">repo, one deployment per</text>
    <text x="658" y="150" font-size="11" fill="#1e40af">cluster.</text>

    <!-- Worker pods -->
    <rect x="380" y="330" width="480" height="140" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="398" y="358" font-size="13" font-weight="700" fill="#0f172a">Worker pods</text>
    <g>
      <rect x="398" y="374" width="140" height="42" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="414" y="400" font-size="11.5" fill="#334155">worker-bounded-a1</text>
      <rect x="550" y="374" width="140" height="42" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="566" y="400" font-size="11.5" fill="#334155">worker-bounded-b7</text>
      <rect x="702" y="374" width="140" height="42" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="718" y="400" font-size="11.5" fill="#334155">worker-bounded-c2</text>
    </g>
    <text x="398" y="446" font-size="11.5" fill="#334155">Each pod exits 0 when its batch is done or the queue is empty.</text>

    <!-- arrows -->
    <g stroke="#64748b" stroke-width="1.6" fill="none" marker-end="url(#ar)">
      <line x1="155" y1="250" x2="155" y2="162"/>
      <line x1="250" y1="113" x2="384" y2="113"/>
      <line x1="570" y1="113" x2="634" y2="113"/>
      <line x1="750" y1="156" x2="750" y2="324"/>
      <path d="M 450 470 L 450 500 L 155 500 L 155 352"/>
    </g>

    <g font-size="10.5" fill="#475569">
      <text x="167" y="200">queue depth</text>
      <text x="167" y="216">or consumer lag</text>
      <text x="317" y="105" text-anchor="middle">patch .spec.replicas</text>
      <text x="602" y="105" text-anchor="middle">watch</text>
      <text x="307" y="493" text-anchor="middle">consume messages</text>
    </g>
    <g font-size="10.5" fill="#475569" text-anchor="end">
      <text x="736" y="222">create a pod when below min</text>
      <text x="736" y="238">delete the newest when above max</text>
      <text x="736" y="254">reap pods that finished</text>
    </g>

    <text x="40" y="528" font-size="11" fill="#475569">Blue: provided by this project. Grey: supplied by you.</text>
  </g>
</svg>
