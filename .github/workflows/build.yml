# This workflow doesn't respect the stonal conventions as we intend to
# open-source this project.
name: Lint & Build

on:
  push:
jobs:
  lint-and-build:
    # GitHub-hosted, not stonal-ubuntu-24.04: this repository is public, and every org
    # runner group sets allows_public_repositories=false, so self-hosted jobs queue
    # forever. GitHub-hosted runners are free for public repositories, and exposing
    # self-hosted runners to fork pull requests would be unsafe anyway.
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v7.0.1

    - name: Set up Go
      uses: actions/setup-go@v7.0.0
      with:
        go-version: '1.26.7'

    - name: Installing tools
      run: |
        sudo apt-get update && sudo apt-get install -y make

    - name: Linting
      uses: golangci/golangci-lint-action@v9.3.0
      with:
          # https://github.com/golangci/golangci-lint/releases
          version: v2.12.2
          args: -v --timeout=20m
          # skip-cache: true

    - name: Run golangci-lint
      run: golangci-lint run

    - name: Build project
      run: make build
