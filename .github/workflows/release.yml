# Publishes the public artifacts for a tagged release: a multi-arch image on GHCR and a
# ready-to-apply install.yaml attached to the GitHub release.
#
# This is the only place controller images are published. Stonal's own clusters deploy
# from GHCR too (see the REGISTRY/IMG block in the Makefile), so a tag pushed here is what
# both external users and aws/* and s3ns/* end up running — there is no separate internal
# ECR build any more.
name: Publish release artifacts

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod

      - uses: docker/setup-qemu-action@v3.7.0
      - uses: docker/setup-buildx-action@v3.12.0

      - name: Log in to GHCR
        uses: docker/login-action@v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5.10.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # A single manifest carrying the CRD, RBAC and the controller deployment, with the
      # image pinned to the tag being released.
      - name: Generate install.yaml
        # steps.meta.outputs.version is the tag that was actually pushed (`0.23.0`),
        # not github.ref_name (`v0.23.0`) — metadata-action's {{version}} pattern strips
        # the leading `v`, so referencing ref_name here pinned install.yaml to a tag that
        # does not exist on GHCR.
        run: make build-installer IMG=ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.version }}

      - name: Attach install.yaml to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2.6.2
        with:
          files: dist/install.yaml
