# permissions for end users to edit boundeddeployments.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: k8s-bounded-deployment
    app.kubernetes.io/managed-by: kustomize
  name: boundeddeployment-editor-role
rules:
- apiGroups:
  - deploy.stonal.io
  resources:
  - boundeddeployments
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - deploy.stonal.io
  resources:
  - boundeddeployments/status
  verbs:
  - get
